name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && 'master-release' || github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Select package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/master') {
            $headTags = @(git tag --points-at HEAD --list 'v*' |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($headTags.Count -gt 1) {
              throw 'The current commit has more than one semantic version tag.'
            }

            if ($headTags.Count -eq 1) {
              $tag = $headTags[0]
            } else {
              $latestTags = @(git tag --list 'v*' --sort=-v:refname |
                Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
                Select-Object -First 1)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              if ($latestTags.Count -eq 0) {
                $tag = 'v0.1.0'
              } else {
                [version]$latest = $latestTags[0].Substring(1)
                $tag = "v$($latest.Major).$($latest.Minor).$($latest.Build + 1)"
              }
            }

            $version = $tag.Substring(1)
            "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $tag.Substring(1)
            "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore FarShell.sln -r win-x64

      - name: Build
        run: dotnet build FarShell.sln -c Release --no-restore

      - name: Test
        run: dotnet test FarShell.sln -c Release --no-build

      - name: Publish framework-dependent executables
        shell: pwsh
        run: |
          $properties = @(
            '-p:PublishSingleFile=true'
            '-p:PublishSelfContained=false'
            '-p:DebugType=None'
            '-p:DebugSymbols=false'
            "-p:Version=$env:RELEASE_VERSION"
          )

          dotnet publish FarShell.Broker/FarShell.Broker.csproj `
            -c Release -r win-x64 --no-self-contained --no-restore `
            @properties -o artifacts/broker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish FarShell.Client/FarShell.Client.csproj `
            -c Release -r win-x64 --no-self-contained --no-restore `
            @properties -o artifacts/client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release assets
        shell: pwsh
        run: |
          $broker = 'artifacts/broker/FarShell.Broker.exe'
          $client = 'artifacts/client/FarShell.Client.exe'
          if (-not (Test-Path -LiteralPath $broker -PathType Leaf)) {
            throw 'Broker publish did not produce FarShell.Broker.exe.'
          }
          if (-not (Test-Path -LiteralPath $client -PathType Leaf)) {
            throw 'Client publish did not produce FarShell.Client.exe.'
          }
          if ((Get-Item -LiteralPath $broker).Length -gt 5MB) {
            throw 'Framework-dependent broker executable is unexpectedly large.'
          }
          if ((Get-Item -LiteralPath $client).Length -gt 5MB) {
            throw 'Framework-dependent client executable is unexpectedly large.'
          }

          Compress-Archive -LiteralPath $broker -DestinationPath artifacts/farshell-win-x64.zip
          Compress-Archive -LiteralPath $client -DestinationPath artifacts/farshell-client-win-x64.zip

          foreach ($archive in @('farshell-win-x64.zip', 'farshell-client-win-x64.zip')) {
            $hash = (Get-FileHash "artifacts/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $archive" | Set-Content "artifacts/$archive.sha256" -Encoding ascii
          }

      - name: Validate release archives
        shell: pwsh
        run: |
          Expand-Archive artifacts/farshell-win-x64.zip artifacts/verify-broker
          Expand-Archive artifacts/farshell-client-win-x64.zip artifacts/verify-client

          $broker = 'artifacts/verify-broker/FarShell.Broker.exe'
          $client = 'artifacts/verify-client/FarShell.Client.exe'
          if (-not (Test-Path -LiteralPath $broker -PathType Leaf)) {
            throw 'Broker archive does not contain FarShell.Broker.exe at its root.'
          }
          if (-not (Test-Path -LiteralPath $client -PathType Leaf)) {
            throw 'Client archive does not contain FarShell.Client.exe at its root.'
          }

          $brokerCheck = Start-Process -FilePath $broker -ArgumentList '0' -Wait -PassThru -WindowStyle Hidden
          if ($brokerCheck.ExitCode -ne 1) {
            throw "Broker package startup check returned $($brokerCheck.ExitCode); expected 1 for invalid arguments."
          }

          $clientCheck = Start-Process -FilePath $client -ArgumentList '127.0.0.1', '0' -Wait -PassThru -WindowStyle Hidden
          if ($clientCheck.ExitCode -ne 1) {
            throw "Client package startup check returned $($clientCheck.ExitCode); expected 1 for invalid arguments."
          }

      - uses: actions/upload-artifact@v7
        with:
          name: FarShell-win-x64
          path: |
            artifacts/farshell-win-x64.zip
            artifacts/farshell-win-x64.zip.sha256
            artifacts/farshell-client-win-x64.zip
            artifacts/farshell-client-win-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(
            'artifacts/farshell-win-x64.zip'
            'artifacts/farshell-win-x64.zip.sha256'
            'artifacts/farshell-client-win-x64.zip'
            'artifacts/farshell-client-win-x64.zip.sha256'
          )

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --generate-notes --title $tag --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    permissions:
      contents: write
