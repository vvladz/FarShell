name: Build and release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && 'master-release' || github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  RELEASE_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FarShell.sln -r win-x64

      - name: Build
        run: dotnet build FarShell.sln -c Release --no-restore -p:Version=$env:RELEASE_VERSION

      - name: Test
        run: dotnet test FarShell.sln -c Release --no-build

      - name: Publish framework-dependent executables
        shell: pwsh
        run: |
          $properties = @(
            '-p:PublishSingleFile=true'
            '-p:PublishSelfContained=false'
            '-p:DebugType=None'
            '-p:DebugSymbols=false'
            "-p:Version=$env:RELEASE_VERSION"
          )

          dotnet publish src/FarShell.Broker/FarShell.Broker.csproj `
            -c Release -r win-x64 --no-self-contained --no-restore `
            @properties -o artifacts/broker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish src/FarShell.Client/FarShell.Client.csproj `
            -c Release -r win-x64 --no-self-contained --no-restore `
            @properties -o artifacts/client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release assets
        shell: pwsh
        run: |
          foreach ($directory in @('artifacts/broker', 'artifacts/client')) {
            Copy-Item -LiteralPath README.md -Destination $directory
            Copy-Item -LiteralPath docs -Destination $directory -Recurse
          }
          $broker = 'artifacts/broker/FarShell.Broker.exe'
          $client = 'artifacts/client/FarShell.Client.exe'
          foreach ($file in @(
            $broker,
            'artifacts/broker/conpty.dll',
            'artifacts/broker/x64/OpenConsole.exe',
            'artifacts/broker/arm64/OpenConsole.exe'
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Broker publish did not produce $file."
            }
          }
          if (-not (Test-Path -LiteralPath $client -PathType Leaf)) {
            throw 'Client publish did not produce FarShell.Client.exe.'
          }
          if ((Get-Item -LiteralPath $broker).Length -gt 5MB) {
            throw 'Framework-dependent broker executable is unexpectedly large.'
          }
          if ((Get-Item -LiteralPath $client).Length -gt 5MB) {
            throw 'Framework-dependent client executable is unexpectedly large.'
          }

          Compress-Archive -Path artifacts/broker/* -DestinationPath artifacts/farshell-win-x64.zip
          Compress-Archive -Path artifacts/client/* -DestinationPath artifacts/farshell-client-win-x64.zip

          foreach ($archive in @('farshell-win-x64.zip', 'farshell-client-win-x64.zip')) {
            $hash = (Get-FileHash "artifacts/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $archive" | Set-Content "artifacts/$archive.sha256" -Encoding ascii
          }

      - name: Validate release archives
        shell: pwsh
        run: |
          Expand-Archive artifacts/farshell-win-x64.zip artifacts/verify-broker
          Expand-Archive artifacts/farshell-client-win-x64.zip artifacts/verify-client

          $broker = 'artifacts/verify-broker/FarShell.Broker.exe'
          $client = 'artifacts/verify-client/FarShell.Client.exe'
          foreach ($file in @(
            $broker,
            'artifacts/verify-broker/conpty.dll',
            'artifacts/verify-broker/x64/OpenConsole.exe',
            'artifacts/verify-broker/arm64/OpenConsole.exe'
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Broker archive does not contain $file."
            }
          }
          if (-not (Test-Path -LiteralPath $client -PathType Leaf)) {
            throw 'Client archive does not contain FarShell.Client.exe at its root.'
          }

          $brokerCheck = Start-Process -FilePath $broker -ArgumentList '0' -Wait -PassThru -WindowStyle Hidden
          if ($brokerCheck.ExitCode -ne 2) {
            throw "Broker package startup check returned $($brokerCheck.ExitCode); expected 2 for invalid arguments."
          }

          $clientCheck = Start-Process -FilePath $client -ArgumentList '127.0.0.1', '0' -Wait -PassThru -WindowStyle Hidden
          if ($clientCheck.ExitCode -ne 2) {
            throw "Client package startup check returned $($clientCheck.ExitCode); expected 2 for invalid arguments."
          }

          foreach ($executable in @($broker, $client)) {
            & $executable --help
            if ($LASTEXITCODE -ne 0) { throw 'Published help failed.' }
            & $executable --version
            if ($LASTEXITCODE -ne 0) { throw 'Published version failed.' }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: FarShell-win-x64
          path: |
            artifacts/farshell-win-x64.zip
            artifacts/farshell-win-x64.zip.sha256
            artifacts/farshell-client-win-x64.zip
            artifacts/farshell-client-win-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $assets = @(
            'artifacts/farshell-win-x64.zip'
            'artifacts/farshell-win-x64.zip.sha256'
            'artifacts/farshell-client-win-x64.zip'
            'artifacts/farshell-client-win-x64.zip.sha256'
          )

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --generate-notes --title $tag --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    permissions:
      contents: write
